<style>
/* One visual world: deep-night cinematic stage, neon light sources, frosted glass panels.
   Layout: sticky glass header + neon tab rail; each view = hero KPIs then chart cards; full-screen list sheet; side drawer for a person. */
:root{
 --bg:#05061a;--bg2:#0b0e2e;--ink:#f5f7ff;--mut:#a9b1dc;--dim:#737ca8;
 --glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.13);
 --saf:#ff8a00;--cyan:#00e5ff;--yel:#ffe14d;--pink:#ff3d9a;--lime:#39ff88;--vio:#b983ff;--coral:#ff6b5b;--wa:#25d366;
 --glow:1;--sheetbg:rgba(7,9,32,.94);
 --disp:"Baloo 2","Kohinoor Devanagari","Nirmala UI","Noto Sans Devanagari",sans-serif;
 --body:"Mukta","Kohinoor Devanagari","Nirmala UI","Noto Sans Devanagari",system-ui,sans-serif;
 --rh:78px;color-scheme:dark}
:root[data-theme="light"]{
 --bg:#f3f5ff;--bg2:#ffffff;--ink:#111433;--mut:#4f5680;--dim:#7d84a8;
 --glass:rgba(255,255,255,.78);--glass2:rgba(17,20,51,.06);--line:rgba(17,20,51,.12);
 --saf:#d96500;--cyan:#0090ad;--yel:#a88600;--pink:#d6136a;--lime:#13b36a;--vio:#8448db;--coral:#d9412f;--wa:#128c4a;
 --glow:.35;--sheetbg:rgba(243,245,255,.96);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
a{color:inherit}
button,input,select,textarea{font-family:var(--body);font-size:16px;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
/* ---------- cinematic background ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5;animation:drift 28s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:52vw;height:52vw;background:#ff6a00;left:-16vw;top:-18vw}
.bgfx i:nth-child(2){width:42vw;height:42vw;background:#ff1f8e;right:-14vw;top:4vw;animation-delay:-8s}
.bgfx i:nth-child(3){width:48vw;height:48vw;background:#1240ff;left:18vw;top:48vw;animation-delay:-14s}
.bgfx i:nth-child(4){width:36vw;height:36vw;background:#00c2a8;right:-4vw;top:78vw;animation-delay:-4s}
.bgfx .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.2px);background-size:26px 26px;mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 70%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 70%)}
:root[data-theme="light"] .bgfx i{opacity:.22}
:root[data-theme="light"] .bgfx .grid{background-image:radial-gradient(rgba(17,20,51,.08) 1px,transparent 1.2px)}
@keyframes drift{to{transform:translate(6vw,5vw) scale(1.15)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- primitives ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 18px 50px rgba(0,0,0,calc(.35*var(--glow))),inset 0 1px 0 rgba(255,255,255,calc(.1*var(--glow)))}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 90px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:700 13px var(--body);letter-spacing:.03em;color:var(--yel)}
html[lang=en] .eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:12.5px}
:root[data-theme="light"] .eyebrow{color:var(--saf)}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;color:#1c0d00;background:linear-gradient(135deg,#ffd166,var(--saf));white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 0 calc(22px*var(--glow)) rgba(255,138,0,.45);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#5dfc9c,#14b85a);color:#022611;box-shadow:0 0 calc(20px*var(--glow)) rgba(37,211,102,.45)}
.btn.cy{background:linear-gradient(135deg,#7df9ff,#00b8e6);color:#00222b;box-shadow:0 0 calc(20px*var(--glow)) rgba(0,229,255,.4)}
.btn.pk{background:linear-gradient(135deg,#ff8cc6,#ff2e88);color:#2b0016;box-shadow:0 0 calc(20px*var(--glow)) rgba(255,61,154,.4)}
.btn.sm{padding:7px 13px;font-size:14.5px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.txt{background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;outline:0;min-width:0;width:100%}
.txt:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.18)}
select.txt option{background:var(--bg2);color:var(--ink)}
.txt::placeholder{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--k,#888) 22%,transparent);border:1px solid color-mix(in srgb,var(--k,#888) 60%,transparent);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--k);box-shadow:0 0 calc(8px*var(--glow)) var(--k)}
.chip{border:1px solid var(--line);background:var(--glass2);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,rgba(0,229,255,.28),rgba(185,131,255,.28));border-color:var(--cyan);box-shadow:0 0 calc(16px*var(--glow)) rgba(0,229,255,.35)}
.hint{font-size:14px;color:var(--mut)}
/* ---------- lock ---------- */
#lock{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:30px max(16px,env(safe-area-inset-left,0px))}
.lockcard{width:min(100%,540px);padding:34px clamp(20px,5vw,42px);display:flex;flex-direction:column;gap:16px}
.lockcard h1{font-size:clamp(34px,7.5vw,50px);line-height:1.04;background:linear-gradient(92deg,#fff 5%,#ffd08a 40%,#ff7ac0 70%,#7df9ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 calc(18px*var(--glow)) rgba(255,122,192,.35))}
:root[data-theme="light"] .lockcard h1{background:linear-gradient(92deg,#3a1a00,#d96500 45%,#d6136a 75%,#0090ad)}
.glyph{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:conic-gradient(from 200deg,#ff8a00,#ff3d9a,#b983ff,#00e5ff,#ff8a00);box-shadow:0 0 calc(40px*var(--glow)) rgba(255,61,154,.55);font:800 30px var(--disp);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.chk{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:15px}
.err{color:#ff8f8f;font-weight:700;min-height:1.4em}
.prog{height:6px;border-radius:9px;background:var(--glass2);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--saf));transition:width .3s}
/* ---------- header + tabs ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hin{max-width:1400px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center}
.brand{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.brand .glyph{width:42px;height:42px;border-radius:14px;font-size:21px;flex:none}
.brand b{display:block;font:800 19px/1.1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass2);display:grid;place-items:center;font-size:18px;flex:none}
.hb.lang{width:auto;padding:0 12px;font-weight:800;font-size:14px}
nav.tabs{max-width:1400px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--glass2);border-radius:999px;padding:8px 15px;font-weight:700;font-size:15px;white-space:nowrap;display:flex;gap:7px;align-items:center;color:var(--ink)}
.tab.on{background:linear-gradient(135deg,#ff8a00,#ff3d9a);border-color:transparent;color:#fff;box-shadow:0 0 calc(22px*var(--glow)) rgba(255,61,154,.55)}
/* ---------- hero + KPI ---------- */
.hero{padding:26px clamp(18px,3vw,34px);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,5.2vw,52px);background:linear-gradient(92deg,#fff,#ffd08a 35%,#ff7ac0 65%,#7df9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="light"] .hero h1{background:linear-gradient(92deg,#1a0a00,#d96500 40%,#d6136a 70%,#0090ad);-webkit-background-clip:text;background-clip:text}
.hero .sub{color:var(--mut);font-size:17px}
.qs{display:flex;gap:10px;max-width:640px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.kpi{position:relative;text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:4px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;color:var(--ink)}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--k);box-shadow:0 0 calc(18px*var(--glow)) var(--k)}
.kpi::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(var(--k),transparent 70%);opacity:calc(.28*var(--glow))}
.kpi:hover{transform:translateY(-2px);border-color:var(--k);box-shadow:0 0 calc(28px*var(--glow)) color-mix(in srgb,var(--k) 45%,transparent)}
.kpi .ic{font-size:22px}
.kpi .l{font-weight:700;color:var(--mut);font-size:14.5px}
.kpi .v{font:800 clamp(30px,3.4vw,40px)/1.05 var(--disp);color:var(--k);text-shadow:0 0 calc(18px*var(--glow)) color-mix(in srgb,var(--k) 60%,transparent)}
:root[data-theme="light"] .kpi .v{color:color-mix(in srgb,var(--k) 85%,#000)}
.kpi .s{font-size:13px;color:var(--dim)}
.insights{display:flex;gap:10px;flex-wrap:wrap}
.ins{border-radius:16px;padding:10px 14px;background:var(--glass2);border:1px solid var(--line);font-size:14.5px;display:flex;gap:8px;align-items:center}
.ins b{color:var(--yel)}
:root[data-theme="light"] .ins b{color:var(--saf)}
/* ---------- cards / layout ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
.card{padding:20px clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:22px}
.card .ch-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chart{width:100%;min-height:120px;position:relative}
svg.ch{display:block;overflow:visible}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .ax{fill:var(--dim);font:12px var(--body)}
svg.ch .vl{fill:var(--ink);font:700 12.5px var(--body)}
svg.ch .bm{filter:drop-shadow(0 0 calc(7px*var(--glow)) var(--gc));transition:opacity .15s}
svg.ch g.bar{cursor:pointer}
svg.ch g.bar:hover .bm{opacity:.8}
svg.ch .seg{cursor:pointer;transition:transform .15s;transform-origin:center}
svg.ch .seg:hover{transform:scale(1.03)}
/* horizontal bars (HTML) */
.hb-list{display:flex;flex-direction:column;gap:6px}
.hbr{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;border:0;background:transparent;padding:6px 6px;border-radius:12px;text-align:left;color:var(--ink);width:100%}
.hbr:hover{background:var(--glass2)}
.hbr .lb{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .tr{height:12px;border-radius:99px;background:var(--glass2);overflow:hidden}
.hbr .tr b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--k) 55%,transparent),var(--k));box-shadow:0 0 calc(12px*var(--glow)) var(--k)}
.hbr .vv{font-weight:800;font-size:14.5px;min-width:52px;text-align:right}
.hbr .vv small{display:block;font-weight:500;color:var(--dim);font-size:12px}
/* donut */
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut .svgw{flex:none}
.legend{display:flex;flex-direction:column;gap:4px;flex:1;min-width:200px}
.lg{display:grid;grid-template-columns:14px 1fr auto auto;gap:9px;align-items:center;border:0;background:transparent;padding:5px 6px;border-radius:10px;text-align:left;color:var(--ink);font-size:14.5px}
.lg:hover{background:var(--glass2)}
.lg i{width:12px;height:12px;border-radius:4px;background:var(--k);box-shadow:0 0 calc(10px*var(--glow)) var(--k)}
.lg b{font-weight:800}.lg span.p{color:var(--dim);font-size:13px;min-width:42px;text-align:right}
/* service cards */
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sc{position:relative;text-align:left;border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink);overflow:hidden;transition:transform .18s,box-shadow .18s}
.sc:hover,.sc.on{transform:translateY(-2px);border-color:var(--k);box-shadow:0 0 calc(26px*var(--glow)) color-mix(in srgb,var(--k) 45%,transparent)}
.sc .t{display:flex;gap:10px;align-items:center;font-weight:800;font-size:16px}
.sc .t .e{font-size:22px}
.sc .n{font:800 32px/1 var(--disp);color:var(--k);text-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--k) 60%,transparent)}
:root[data-theme="light"] .sc .n{color:color-mix(in srgb,var(--k) 85%,#000)}
.sc .m{font-size:13px;color:var(--dim)}
/* detail panel */
#svd,#ad{scroll-margin-top:130px}
.detail{border-color:var(--k,var(--line))!important;box-shadow:0 0 calc(30px*var(--glow)) color-mix(in srgb,var(--k,#fff) 25%,transparent)!important}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mk div{border-radius:16px;background:var(--glass2);border:1px solid var(--line);padding:10px 14px}
.mk b{display:block;font:800 26px/1.1 var(--disp)}
.mk span{font-size:13px;color:var(--mut)}
/* area ranking */
.arow{display:grid;grid-template-columns:34px minmax(120px,1.2fr) 2fr 84px;gap:12px;align-items:center;padding:9px 8px;border-radius:14px;border:0;background:transparent;width:100%;text-align:left;color:var(--ink)}
.arow:hover{background:var(--glass2)}
.arow .rk{font:800 15px var(--disp);color:var(--dim);text-align:center}
.arow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .nm small{display:block;font-weight:500;font-size:12.5px;color:var(--dim)}
.arow .tr{height:12px;border-radius:99px;background:var(--glass2);overflow:hidden}
.arow .tr b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#00e5ff,#b983ff,#ff3d9a);box-shadow:0 0 calc(12px*var(--glow)) rgba(185,131,255,.7)}
.arow .vv{font-weight:800;text-align:right}
.alist{display:flex;flex-direction:column;max-height:720px;overflow:auto;padding-right:4px}
/* heat calendar */
.calw{overflow-x:auto;padding-bottom:6px}
.legend-seq{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim)}
.legend-seq i{width:14px;height:14px;border-radius:4px;display:inline-block}
/* heat table */
.ht{border-collapse:separate;border-spacing:3px;width:100%;font-size:13.5px}
.ht th{font-weight:700;color:var(--mut);text-align:left;padding:4px 6px;white-space:nowrap}
.ht td{text-align:center;border-radius:8px;padding:7px 4px;font-weight:700;cursor:pointer;min-width:52px}
.ht td:hover{outline:2px solid var(--cyan)}
/* inline people rows */
.plist{display:flex;flex-direction:column}
/* ---------- list rows (shared) ---------- */
.lr{height:var(--rh);display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer}
.lr:hover{background:var(--glass2)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:800 18px var(--disp);color:#fff;background:linear-gradient(135deg,var(--k),color-mix(in srgb,var(--k) 40%,#000));box-shadow:0 0 calc(14px*var(--glow)) color-mix(in srgb,var(--k) 55%,transparent)}
.lr .c{min-width:0}
.lr .n1{display:flex;gap:8px;align-items:center;min-width:0}
.lr .n1 b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .n2{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .n2 .tn{color:var(--ink);font-weight:600}
.cnt{font-size:12px;font-weight:800;border-radius:99px;padding:1px 8px;background:rgba(255,225,77,.18);color:var(--yel);border:1px solid rgba(255,225,77,.5);white-space:nowrap}
.done{font-size:12px;font-weight:800;border-radius:99px;padding:1px 8px;background:rgba(57,255,136,.16);color:var(--lime);border:1px solid rgba(57,255,136,.5);white-space:nowrap}
.acts{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:18px;border:1px solid var(--line);background:var(--glass2)}
.ib.call{background:linear-gradient(135deg,#7df9ff,#00a3cc);border:0;box-shadow:0 0 calc(14px*var(--glow)) rgba(0,229,255,.5)}
.ib.wa{background:linear-gradient(135deg,#5dfc9c,#11a650);border:0;box-shadow:0 0 calc(14px*var(--glow)) rgba(37,211,102,.5)}
.ib.off{opacity:.3;pointer-events:none;filter:grayscale(1)}
.ib svg{width:20px;height:20px;fill:#062018}
.ib.call svg{fill:#00212b}
/* ---------- sheet (full list) ---------- */
#sheet{position:fixed;inset:0;z-index:70;background:var(--sheetbg);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sh-h{max-width:1100px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.sh-h h2{font-size:clamp(20px,3.4vw,28px)}
#lbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.vwrap{max-width:1100px;margin:0 auto;position:relative}
#vrows{position:absolute;left:0;right:0;top:0}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
/* ---------- drawer ---------- */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:79}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:80;background:var(--bg2);border-left:1px solid var(--line);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 40px;display:flex;flex-direction:column;gap:16px;box-shadow:-20px 0 60px rgba(0,0,0,.45)}
.dh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dh h3{font-size:28px}
.x{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--glass2);font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mut);font-weight:600}
.kv dd{margin:0;font-weight:600}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px}
.tl div{position:relative;padding:8px 0 8px 18px}
.tl div::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--k);box-shadow:0 0 calc(10px*var(--glow)) var(--k)}
.tl .d{font-weight:800}
.msg{white-space:pre-wrap;background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.6)}
.mcard{width:min(100%,560px);max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--bg2)}
.qname{font:800 30px/1.1 var(--disp)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px;color:var(--mut)}
textarea.txt{min-height:120px;resize:vertical}
/* ---------- filters ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
/* ---------- misc ---------- */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:260px}
#tip b{font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;background:var(--bg2);border:1px solid var(--cyan);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 0 calc(24px*var(--glow)) rgba(0,229,255,.4);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
footer{color:var(--dim);font-size:13px;text-align:center;padding:10px 0 0}
.sec-t{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-t h2{font-size:clamp(24px,3.4vw,34px)}
@media(max-width:640px){
 :root{--rh:84px}
 .brand small{display:none}
 .hin{gap:7px}.hlock{display:none!important}.hb{width:38px;height:38px;border-radius:12px;font-size:16px}.hb.lang{padding:0 9px}
 .brand .glyph{width:36px;height:36px;font-size:18px;border-radius:12px}.brand b{font-size:16px}
 .lr{grid-template-columns:38px 1fr auto;gap:10px;padding:0 4px}
 .av{width:38px;height:38px;font-size:16px;border-radius:12px}
 .ib{width:40px;height:40px}
 .lr .n2{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
 .arow{grid-template-columns:26px 1fr 64px;gap:8px}
 .arow .tr{grid-column:2/4;grid-row:2}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .kpi{padding:13px 13px 11px}
 .kpi .v{font-size:28px}
 .hbr{grid-template-columns:minmax(80px,40%) 1fr auto}
}
@media print{.bgfx,header.top,.btn,.chip{display:none!important}}
</style>

async function gunzipText(buf){if(typeof DecompressionStream!=='undefined'){try{return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}catch(e){}}

 const W=Math.max(260,el.clientWidth||600),Hh=o.h||230,pl=o.pl??38,pr=6,pt=22,pb=o.pb??30;const n=items.length||1;
 const max=niceMax(Math.max(1,...items.map(d=>d.v)));const slot=(W-pl-pr)/n;const bw=Math.max(2,Math.min(o.maxw||44,slot-Math.max(2,slot*.22)));
 const every=Math.max(1,Math.ceil(n/Math.floor((W-pl)/(o.lw||46))));
 let s=`<svg class="ch" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img">${gradDefs(items.map(d=>d.c))}`;

  s+=`<g class="bar" data-i="${i}"><rect x="${pl+slot*i}" y="${pt}" width="${slot}" height="${Hh-pt-pb}" fill="transparent"/><path class="bm" d="${roundTop(x,y,bw,bh,4)}" fill="url(#g${d.c.slice(1)})" style="--gc:${d.c}"/></g>`;

function heatCal(el,counts,o={}){mount(el,()=>{const start=MIND-wday(MIND),end=MAXD;const weeks=Math.ceil((end-start+1)/7);const cs=Math.max(11,Math.min(17,Math.floor(((el.clientWidth||900)-40)/weeks)-2));const g=2,top=18,left=34;

 el.querySelectorAll('rect[data-d]').forEach(r=>{const d=+r.dataset.d;r.addEventListener('pointermove',e=>tipShow(e,`<b>${fmt(counts.get(d)||0)}</b> ${t('visits')}<br>${WDF[LANG][wday(d)]}, ${fD(d)}`));r.addEventListener('pointerleave',tipHide);r.addEventListener('click',()=>{tipHide();o.onClick&&o.onClick(d)})})})}

function countBy(idx,keyFn,n){const c=new Array(n).fill(0);for(const i of idx){const k=keyFn(i);if(k>=0&&k<n)c[k]++}return c}
function monthsSpan(){const a=mKey(MIND),b=mKey(MAXD);const r=[];for(let k=a;k<=b;k++)r.push(k);return r}
function byMonth(idx){const ms=monthsSpan();const base=ms[0];const c=new Array(ms.length).fill(0);for(const i of idx)c[mKey(D[i])-base]++;return ms.map((k,j)=>({k,v:c[j]}))}
function uniqP(idx){const s=new Set();for(const i of idx)s.add(PID[i]);return s.size}
function allIdx(){const a=new Array(N);for(let i=0;i<N;i++)a[i]=i;return a}
function purposeItems(idx,fold=true){const c=countBy(idx,i=>PU[i],P.purpose.length);let it=c.map((v,p)=>({p,v,l:pName(p),c:pcol(p)})).filter(d=>d.v>0).sort((a,b)=>b.v-a.v);
 if(fold){const big=it.filter(d=>d.p<7||d.p===16),small=it.filter(d=>!(d.p<7||d.p===16));if(small.length>1){const v=small.reduce((a,d)=>a+d.v,0);it=big.concat([{p:-1,ps:small.map(d=>d.p),v,l:t('others'),c:SMALLC[THEME]}])}}
 return it}
function areaItems(idx,limit){const c=countBy(idx,i=>AR[i],NAREA);const it=c.map((v,a)=>({a,v,l:aName(a),c:SEQ()})).filter(d=>d.v>0&&P.area_kind[d.a]!=='X').sort((x,y)=>y.v-x.v);return limit?it.slice(0,limit):it}
function hourItems(idx){const c=countBy(idx,i=>H[i],24);const hs=[];for(let h=9;h<=18;h++)hs.push(h);c[9]+=c[8];return hs.map(h=>({h,v:c[h],l:(h%12||12)+(h<12?'am':'pm'),c:'#B983FF'}))}
function pFilter(fn){const o=[];for(let i=0;i<N;i++)if(fn(i))o.push(i);return o}
const fH=h=>(h%12||12)+(h<12?' am':' pm');

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
async function deflateRaw(b){if(typeof CompressionStream==='undefined')return null;try{return new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer())}catch(e){return null}}
async function zipFiles(files,type){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 for(const[name,data]of files){const nb=enc.encode(name),crc=crc32(data);let comp=await deflateRaw(data),meth=8;if(!comp||comp.length>=data.length){comp=data;meth=0}
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,meth,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,comp.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nb.length,true);
  parts.push(new Uint8Array(h.buffer),nb,comp);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,meth,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,comp.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
  cen.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+comp.length}
 let cs=0;for(const p of cen)cs+=p.length;const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

const xesc=s=>String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F￾￿]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function colL(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}

   if(ri===0)s+=`<c r="${a}" s="1" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
   else if(typeof v==='number'&&isFinite(v))s+=`<c r="${a}"><v>${v}</v></c>`;

function bdayMap(a,b){const want=new Map();for(let d=a;d<=b;d++){const x=dDate(d);want.set((x.getUTCMonth()+1)*100+x.getUTCDate(),d)}
 const leap=y=>(y%4===0&&y%100!==0)||y%400===0;const r=new Map();
 for(const p of PEOPLE){if(!p.dob)continue;let md=p.dob%10000;if(md===101)continue;if(md===229&&!leap(NOW.getFullYear()))md=228;if(want.has(md)&&OK[p.i])r.set(p.id,want.get(md))}return r}
function vBday(m){let a,b;if(BD.p==='today'){a=b=TODAY}else if(BD.p==='tom'){a=b=TODAY+1}else if(BD.p==='week'){a=TODAY;b=TODAY+6}else{const y=NOW.getFullYear();const mm=BD.p==='month'?NOW.getMonth():BD.m;a=Math.round((Date.UTC(y,mm,1)-EPOCH)/DAY);b=Math.round((Date.UTC(y,mm+1,1)-EPOCH)/DAY)-1}
 const map=bdayMap(a,b);const ids=[...map.keys()];const idx=ids.map(id=>PEOPLE[id].i);
 const cT=bdayMap(TODAY,TODAY).size,cW=bdayMap(TODAY,TODAY+6).size;const y=NOW.getFullYear();const cM=bdayMap(Math.round((Date.UTC(y,NOW.getMonth(),1)-EPOCH)/DAY),Math.round((Date.UTC(y,NOW.getMonth()+1,1)-EPOCH)/DAY)-1).size;
 const ps=[['today','bd_today'],['tom','bd_tom'],['week','bd_week'],['month','bd_month']];
 m.innerHTML=`<section class="glass hero"><div class="eyebrow">🎂 ${esc(t('t_bday'))}</div><h1 style="font-size:clamp(28px,4.4vw,44px)">${esc(t('bd_h'))}</h1>
 <div class="kpis">${kpi('bk1','🎂',t('bd_today'),cT,fD(TODAY),nk('p'))}${kpi('bk2','🎈',t('bd_week'),cW,'',nk('o'))}${kpi('bk3','🎉',t('bd_month'),cM,esc(MONF[LANG][NOW.getMonth()]),nk('c'))}</div>
 <div class="row">${ps.map(([k,l])=>`<button class="chip${BD.p===k?' on':''}" type="button" data-p="${k}">${esc(t(l))}</button>`).join('')}<select class="txt" id="bm" style="width:auto"><option value="">${esc(t('bd_pick'))}</option>${MONF[LANG].map((x,k)=>`<option value="${k}"${BD.p==='pick'&&BD.m===k?' selected':''}>${esc(x)}</option>`).join('')}</select></div></section>
 ${card(`<div class="ch-h"><div><h3>${esc(a===b?fD(a):fD(a)+' – '+fD(b))}</h3><div class="hint">${fmt(idx.length)} ${esc(t('people'))}</div></div><div class="row"><button class="btn pk" type="button" id="bq"${idx.length?'':' disabled'}>▶ ${esc(t('bd_all'))}</button><button class="btn sm" type="button" id="bl"${idx.length?'':' disabled'}>📋 ${esc(t('openList'))}</button></div></div><div class="plist" id="bP"></div>`)}`;
 animKPIs(m);
 m.querySelectorAll('.chip[data-p]').forEach(c=>c.onclick=()=>{BD.p=c.dataset.p;render()});$('bm').onchange=e=>{if(e.target.value!==''){BD={p:'pick',m:+e.target.value};render()}};
 $('bk1').onclick=()=>{BD.p='today';render()};$('bk2').onclick=()=>{BD.p='week';render()};$('bk3').onclick=()=>{BD.p='month';render()};
 const sorted=idx.slice().sort((x,y)=>map.get(PID[x])-map.get(PID[y])||NM[x].localeCompare(NM[y]));
 $('bq').onclick=()=>startQueue(sorted,'bday');$('bl').onclick=()=>openList(t('l_bday')+' · '+(a===b?fDs(a):fDs(a)+' – '+fDs(b)),sorted,'bday',{kind:'bday',bdays:map});
 const el=$('bP');LIST.bdays=map;el.innerHTML=sorted.length?sorted.slice(0,60).map(i=>rowHTML(i,'bday','bday')).join('')+(sorted.length>60?`<button class="btn ghost" type="button" id="bmore" style="margin-top:10px">${esc(t('seeAll'))} (${fmt(sorted.length)}) →</button>`:''):`<div class="empty">${esc(t('bd_none'))}</div>`;bindRows(el,'bday');if($('bmore'))$('bmore').onclick=$('bl').onclick}

/* ---------- AGE ---------- */
function vAge(m){const ab=countBy(PEOPLE.map(p=>p.band),b=>b,7);const unk=PEOPLE.filter(p=>p.band<0).length;const amx=Math.max(...ab);
 const sen=PEOPLE.filter(p=>p.age!=null&&p.age>=60),yo=PEOPLE.filter(p=>p.age!=null&&p.age>=18&&p.age<=35);
 const pu=purposeItems(allIdx(),false).filter(d=>d.p!==16).slice(0,8).concat([{p:16,l:pName(16)}]);
 const mat=pu.map(d=>AGEB.map((_,k)=>0));for(let i=0;i<N;i++){const b=person(i).band;if(b<0)continue;const r=pu.findIndex(d=>d.p===PU[i]);if(r>=0)mat[r][b]++}
 const mmx=Math.max(1,...mat.flat());const col=SEQ();
 m.innerHTML=`<section class="glass hero"><div class="eyebrow">👥 ${esc(t('t_age'))}</div><h1 style="font-size:clamp(28px,4.4vw,44px)">${esc(t('ag_title'))}</h1><div class="hint">${esc(t('ag_h'))}</div>
 <div class="kpis">${kpi('gk1','👴',t('ag_sen'),sen.length,pct(sen.length,PEOPLE.length),nk('o'))}${kpi('gk2','🧑',t('ag_youth'),yo.length,pct(yo.length,PEOPLE.length),nk('g'))}${kpi('gk3','❔',t('ag_unk'),unk,'',nk('v'))}</div></section>
 ${card(`<h3>${esc(t('ch_age'))}</h3><div class="chart" id="gA"></div>`)}
 ${card(`<div><h3>${esc(t('ag_mat'))}</h3><div class="hint">${esc(t('ag_mat_h'))}</div></div><div style="overflow-x:auto"><table class="ht"><thead><tr><th></th>${AGEL[LANG].map(l=>`<th style="text-align:center">${esc(l)}</th>`).join('')}</tr></thead><tbody>${pu.map((d,r)=>`<tr><th>${PEMO[d.p]} ${esc(d.l)}</th>${mat[r].map((v,k)=>{const o=v/mmx;return `<td data-r="${r}" data-k="${k}" style="background:color-mix(in srgb,${col} ${Math.round(8+o*80)}%,transparent);color:${o>.55&&THEME==='dark'?'#00141a':'var(--ink)'}">${fmt(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`)}`;
 animKPIs(m);
 $('gk1').onclick=()=>openList(t('ag_sen'),sen.map(p=>p.i),'person');$('gk2').onclick=()=>openList(t('ag_youth'),yo.map(p=>p.i),'person');$('gk3').onclick=()=>openList(t('ag_unk'),PEOPLE.filter(p=>p.band<0).map(p=>p.i),'person');
 barsV($('gA'),ab.map((v,k)=>({l:AGEL[LANG][k],v,c:v===amx?nk('p'):nk('g'),lab:true,tip:`<b>${fmt(v)}</b> ${t('people')}<br>${AGEL[LANG][k]}`})),{h:240,maxw:60,lw:44,onClick:(d,k)=>openList(t('ch_age')+' · '+AGEL[LANG][k],PEOPLE.filter(p=>p.band===k).map(p=>p.i),'person')});
 m.querySelectorAll('.ht td').forEach(td=>td.onclick=()=>{const d=pu[+td.dataset.r],k=+td.dataset.k;openList(d.l+' · '+AGEL[LANG][k],pFilter(i=>PU[i]===d.p&&person(i).band===k),'visit')})}

/* ---------- VOLUNTEERS ---------- */
function vVol(m){const vs=PEOPLE.filter(p=>p.vol).sort((a,b)=>b.last-a.last);const idx=vs.map(p=>p.i);
 m.innerHTML=`<section class="glass hero"><div class="eyebrow">🙋 ${esc(t('t_vol'))}</div><h1 style="font-size:clamp(28px,4.4vw,44px)">${esc(t('vo_title'))}</h1><div class="hint">${esc(t('vo_h'))}</div>
 <div class="kpis">${kpi('vk1','🙋',t('k_vol'),vs.length,'',nk('b'))}</div><div class="row"><button class="btn pk" type="button" id="vq">▶ ${esc(t('queue'))}</button><button class="btn" type="button" id="vl">📋 ${esc(t('openList'))}</button><button class="btn wa" type="button" id="vwa">📲 ${esc(t('shareWa'))}</button></div></section>
 <div class="grid2">${card(`<h3>${esc(t('vo_area'))}</h3><div id="vA"></div>`)}${card(`<h3>${esc(t('l_vol'))}</h3><div class="plist" id="vP"></div>`)}</div>`;
 animKPIs(m);
 const op=()=>openList(t('l_vol'),idx,'person',{kind:'vol'});$('vk1').onclick=op;$('vl').onclick=op;$('vq').onclick=()=>startQueue(idx,'vol');$('vwa').onclick=()=>waShare(reportText(t('l_vol'),idx));
 barsH($('vA'),areaItems(idx,12).map(d=>({...d,c:nk('b')})),{total:idx.length,onClick:d=>openList(t('l_vol')+' · '+d.l,idx.filter(i=>AR[i]===d.a),'person',{kind:'vol'})});
 const el=$('vP');el.innerHTML=idx.map(i=>rowHTML(i,'person','vol')).join('');bindRows(el,'vol')}

/* ---------- RECORDS / SEARCH ---------- */
let RF=LS.get('dpk_rf',{});
function recFilter(f){const a=isoD(f.from),b=isoD(f.to),q=(f.q||'').trim().toLowerCase(),qs=q?q.split(/\s+/):[];const pu=f.pu===''||f.pu==null?null:+f.pu,sb=f.sb===''||f.sb==null?null:+f.sb,ar=f.ar===''||f.ar==null?null:+f.ar,ag=f.ag===''||f.ag==null?null:+f.ag;
 return pFilter(i=>(a==null||D[i]>=a)&&(b==null||D[i]<=b)&&(pu==null||PU[i]===pu)&&(sb==null||SB[i]===sb)&&(ar==null||AR[i]===ar)&&(ag==null||person(i).band===ag)&&(!f.rep||person(i).nd>=2)&&(!f.vol||person(i).vol)&&(!f.mob||OK[i])&&(!qs.length||qs.every(w=>HAY[i].includes(w))))}
function vRec(m){const ars=areaItems(allIdx()).sort((x,y)=>x.l.localeCompare(y.l));const opt=(v,l,sel)=>`<option value="${v}"${String(sel??'')===String(v)?' selected':''}>${esc(l)}</option>`;
 m.innerHTML=`<section class="glass hero"><div class="eyebrow">🔍 ${esc(t('t_rec'))}</div><h1 style="font-size:clamp(28px,4.4vw,44px)">${esc(t('rc_title'))}</h1><div class="hint">${esc(t('rc_h'))}</div>
 <div class="fgrid">
  <label class="f">${esc(t('f_q'))}<input class="txt" id="f_q" type="search" value="${esc(RF.q||'')}"></label>
  <label class="f">${esc(t('f_from'))}<input class="txt" id="f_from" type="date" value="${esc(RF.from||'')}" min="${dISO(MIND)}" max="${dISO(MAXD)}"></label>
  <label class="f">${esc(t('f_to'))}<input class="txt" id="f_to" type="date" value="${esc(RF.to||'')}" min="${dISO(MIND)}" max="${dISO(MAXD)}"></label>
  <label class="f">${esc(t('f_pur'))}<select class="txt" id="f_pu">${opt('',t('all'),RF.pu)}${P.purpose.map((x,p)=>opt(p,pName(p),RF.pu)).join('')}</select></label>
  <label class="f">${esc(t('f_sub'))}<select class="txt" id="f_sb">${opt('',t('all'),RF.sb)}${P.sub.map((x,s)=>opt(s,sName(s),RF.sb)).join('')}</select></label>
  <label class="f">${esc(t('f_area'))}<select class="txt" id="f_ar">${opt('',t('all'),RF.ar)}${ars.map(d=>opt(d.a,d.l,RF.ar)).join('')}</select></label>
  <label class="f">${esc(t('f_age'))}<select class="txt" id="f_ag">${opt('',t('all'),RF.ag)}${AGEL[LANG].map((l,k)=>opt(k,l,RF.ag)).join('')}</select></label>
  <label class="f">${esc(t('f_mode'))}<select class="txt" id="f_mode">${opt('visit',t('m_visit'),RF.mode||'visit')}${opt('person',t('m_person'),RF.mode||'visit')}</select></label>
 </div>
 <div class="row"><label class="chk"><input type="checkbox" id="f_rep"${RF.rep?' checked':''}> ${esc(t('f_rep'))}</label><label class="chk"><input type="checkbox" id="f_vol"${RF.vol?' checked':''}> ${esc(t('f_vol'))}</label><label class="chk"><input type="checkbox" id="f_mob"${RF.mob?' checked':''}> ${esc(t('f_mob'))}</label><span class="sp"></span><button class="btn ghost sm" type="button" id="f_reset">✕ ${esc(t('reset'))}</button></div>
 <div class="kpis" id="rk"></div>
 <div class="row"><button class="btn" type="button" id="rlist">📋 ${esc(t('openList'))}</button><button class="btn wa" type="button" id="rwa">📲 ${esc(t('shareWa'))}</button><button class="btn pk" type="button" id="rq">▶ ${esc(t('queue'))}</button></div></section>
 <div class="grid2">${card(`<h3>${esc(t('ch_pur'))}</h3><div id="rP"></div>`)}${card(`<h3>${esc(t('ch_area'))}</h3><div id="rA"></div>`)}</div>`;
 let cur=[];const ids=['q','from','to','pu','sb','ar','ag','mode'];
 const run=()=>{RF={};ids.forEach(k=>RF[k]=$('f_'+k).value);['rep','vol','mob'].forEach(k=>RF[k]=$('f_'+k).checked);LS.set('dpk_rf',RF);cur=recFilter(RF);
  $('rk').innerHTML=kpi('rk1','📋',t('k_visits'),cur.length,esc(t('found')),nk('o'))+kpi('rk2','👥',t('people'),uniqP(cur),'',nk('c'));$('rk').querySelectorAll('.v').forEach(e=>e.textContent=fmt(+e.dataset.v));
  $('rk1').onclick=$('rlist').onclick;$('rk2').onclick=()=>openList(t('rc_title'),cur,'person');
  barsH($('rP'),purposeItems(cur,false),{total:cur.length,onClick:d=>{$('f_pu').value=d.p;run()}});barsH($('rA'),areaItems(cur,12),{total:cur.length,onClick:d=>{$('f_ar').value=d.a;run()}})};
 let tmr;ids.concat(['rep','vol','mob']).forEach(k=>{const e=$('f_'+k);e.addEventListener(k==='q'?'input':'change',()=>{clearTimeout(tmr);tmr=setTimeout(run,180)})});
 $('f_reset').onclick=()=>{RF={};LS.set('dpk_rf',RF);render()};
 $('rlist').onclick=()=>openList(t('rc_title'),cur,RF.mode==='person'?'person':'visit');$('rwa').onclick=()=>waShare(reportText(t('rc_title'),cur));$('rq').onclick=()=>startQueue(cur.slice().sort((x,y)=>D[y]-D[x]),'follow');
 run()}

/* ======================= settings ======================= */
function openSettings(){const m=$('modal'),c=$('mcard');m.hidden=false;const L=ME.mlang||'mr';
 c.innerHTML=`<div class="row" style="justify-content:space-between"><h3>⚙️ ${esc(t('st_title'))}</h3><button class="x" type="button" id="sx">✕</button></div>
 <label class="f">${esc(t('st_mlang'))}<select class="txt" id="s_ml"><option value="mr"${L==='mr'?' selected':''}>मराठी</option><option value="en"${L==='en'?' selected':''}>English</option></select></label>
 <label class="f">${esc(t('st_sender'))}<input class="txt" id="s_sn" value="${esc(sender())}"></label>
 <div><b>${esc(t('st_tpl'))}</b><div class="hint">${esc(t('st_tpl_h'))}</div></div>
 ${['follow','bday','vol'].map(k=>`<label class="f">${esc(t('tp_'+k))}<textarea class="txt" id="s_t_${k}">${esc(tpl(k))}</textarea></label>`).join('')}
 <div class="row"><button class="btn" type="button" id="ssave">${esc(t('st_save'))}</button><button class="btn ghost" type="button" id="sreset">${esc(t('st_reset'))}</button></div>
 <hr style="border:0;border-top:1px solid var(--line);width:100%">
 <button class="btn cy" type="button" id="soff">${esc(t('st_offline'))}</button><div class="hint">${esc(t('st_offline_h'))}</div>
 <button class="btn ghost sm" type="button" id="sclr">${esc(t('st_clear'))}</button>
 <button class="btn pk sm" type="button" data-act="lock">🔒 ${esc(t('st_lock'))}</button>`;
 $('sx').onclick=()=>m.hidden=true;
 $('s_ml').onchange=e=>{ME.mlang=e.target.value;LS.set('dpk_me',ME);openSettings()};
 $('ssave').onclick=()=>{const L=ME.mlang||'mr';ME['s_'+L]=$('s_sn').value.trim();['follow','bday','vol'].forEach(k=>ME['t_'+L+'_'+k]=$('s_t_'+k).value);LS.set('dpk_me',ME);toast(t('saved'));m.hidden=true;if(!$('sheet').hidden)drawRows()};
 $('sreset').onclick=()=>{const L=ME.mlang||'mr';delete ME['s_'+L];['follow','bday','vol'].forEach(k=>delete ME['t_'+L+'_'+k]);LS.set('dpk_me',ME);openSettings()};
 $('soff').onclick=()=>{nativeSave('karyalay-bhet-dashboard.html',new Blob([ORIG],{type:'text/html;charset=utf-8'}));toast('✓')};
 $('sclr').onclick=()=>{for(const k of Object.keys(DONE))delete DONE[k];LS.set('dpk_done',DONE);toast('✓');render()}}

/* ======================= boot + global events ======================= */
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
 document.querySelectorAll('[data-act="lang"]').forEach(b=>b.textContent=LANG==='mr'?'EN':'मराठी');$('themebtn').textContent=THEME==='dark'?'☀️':'🌙';document.title=t('hdrTitle')+' · '+t('hdrSub')}
function boot(){$('lock').hidden=true;$('app').hidden=false;applyLang();buildTabs();render();
 if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='lang'){LANG=LANG==='mr'?'en':'mr';LS.set('dpk_lang',LANG);applyLang();if(P){buildTabs();render();if(!$('sheet').hidden){$('lcount').textContent='';applyList()}}}
 else if(a==='theme'){THEME=THEME==='dark'?'light':'dark';LS.set('dpk_theme',THEME);document.documentElement.dataset.theme=THEME;applyLang();if(P)render()}
 else if(a==='settings')openSettings();
 else if(a==='lock'){LS.del('dpk_pw');location.hash='';location.reload()}});
$('lockform').addEventListener('submit',e=>{e.preventDefault();unlock($('pw').value)});
$('lback').onclick=()=>{if(history.state&&history.state.sheet)history.back();else closeList()};
window.addEventListener('popstate',()=>{if(!$('drawer').hidden){closePerson();return}if(!$('sheet').hidden)closeList()});
$('lq').addEventListener('input',()=>{clearTimeout(window.__lq);window.__lq=setTimeout(()=>{LIST.q=$('lq').value;$('lbody').scrollTop=0;applyList()},150)});
$('lsort').onchange=e=>{LIST.sort=e.target.value;applyList()};
$('lbody').addEventListener('scroll',()=>requestAnimationFrame(drawRows),{passive:true});
$('vrows').addEventListener('click',e=>{const r=e.target.closest('.lr');if(!r)return;if(e.target.closest('[data-stop]')){const dn=e.target.closest('[data-done]');if(dn&&!DONE[dn.dataset.done]){setDone(+dn.dataset.done);setTimeout(drawRows,300)}return}openPerson(+r.dataset.i,LIST.kind)});
$('lwa').onclick=()=>waShare(listSummary());$('lxlsx').onclick=exportXLSX;$('lfile').onclick=shareFile;$('lprint').onclick=printList;$('lqueue').onclick=()=>startQueue(LIST.cur,LIST.kind);
$('ov').onclick=closePerson;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden)$('modal').hidden=true;else if(!$('drawer').hidden)closePerson();else if(!$('sheet').hidden)closeList()}});
let RZ;addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(()=>{rerenderCharts();if(!$('sheet').hidden)applyList()},200)});
applyLang();
(()=>{const s=LS.get('dpk_pw',null);if(s){$('pw').value=s;unlock(s)}})();
</script>
