<style>
/* One visual world: bright pastel daylight stage (peach · lavender · mint · sky) with neon accent ink; white frosted cards with a coloured top rule.
   Layout (home): intro + big headline number box; coloured stat strip; chart panels; flow strip; per-service cards with item lists; feature tiles; confidential footer.
   Alternate "night" theme = deep navy (not black) with the same accents. */
:root{
 --bg:#f7f4ff;--bg2:#ffffff;--card:#ffffff;--ink:#141a3d;--mut:#535b82;--dim:#868cab;
 --glass:rgba(255,255,255,.84);--glass2:rgba(20,26,61,.045);--line:rgba(20,26,61,.10);
 --saf:#ff7a00;--cyan:#00a9d6;--yel:#e6a800;--pink:#f0167d;--lime:#00b862;--vio:#8b3dff;--coral:#ff4d3d;--blue:#2f6bff;--wa:#12a150;
 --glow:.35;--sheetbg:rgba(247,244,255,.97);--shadow:0 12px 34px rgba(60,40,140,.09);
 --disp:"Baloo 2","Kohinoor Devanagari","Nirmala UI","Noto Sans Devanagari",sans-serif;
 --body:"Mukta","Kohinoor Devanagari","Nirmala UI","Noto Sans Devanagari",system-ui,sans-serif;
 --rh:78px;color-scheme:light}
:root[data-theme="dark"]{
 --bg:#0c1230;--bg2:#141b40;--card:#141b40;--ink:#f3f5ff;--mut:#aab2d8;--dim:#7c85ad;
 --glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);
 --saf:#ff8a1f;--cyan:#22d3ee;--yel:#ffd34d;--pink:#ff4fa3;--lime:#3ee38f;--vio:#b18cff;--coral:#ff6b5b;--blue:#6f9bff;--wa:#25d366;
 --glow:.8;--sheetbg:rgba(12,18,48,.97);--shadow:0 14px 40px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--disp);margin:0;line-height:1.15;text-wrap:balance}
a{color:inherit}
button,input,select,textarea{font-family:var(--body);font-size:16px;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* ---------- pastel background ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(160deg,#fff3e8 0%,#f7f0ff 38%,#eef6ff 66%,#ecfbf4 100%)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75;animation:drift 30s ease-in-out infinite alternate}
.bgfx i:nth-child(1){width:46vw;height:46vw;background:#ffd2ad;left:-12vw;top:-14vw}
.bgfx i:nth-child(2){width:40vw;height:40vw;background:#ffc6e4;right:-10vw;top:2vw;animation-delay:-8s}
.bgfx i:nth-child(3){width:44vw;height:44vw;background:#c9ddff;left:22vw;top:52vw;animation-delay:-14s}
.bgfx i:nth-child(4){width:36vw;height:36vw;background:#c4f3df;right:-4vw;top:82vw;animation-delay:-4s}
.bgfx .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(20,26,61,.06) 1px,transparent 1.2px);background-size:24px 24px;mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 60%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 60%)}
:root[data-theme="dark"] .bgfx{background:radial-gradient(1200px 600px at 10% -10%,#1b2560,transparent),linear-gradient(180deg,#0c1230,#0a0f28)}
:root[data-theme="dark"] .bgfx i{opacity:.16}
:root[data-theme="dark"] .bgfx .grid{background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px)}
@keyframes drift{to{transform:translate(5vw,4vw) scale(1.12)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---------- primitives ---------- */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:var(--shadow)}
.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:700 14px var(--body);color:var(--saf);display:flex;gap:8px;align-items:center}
.eyebrow::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--saf);box-shadow:0 0 0 4px color-mix(in srgb,var(--saf) 22%,transparent);flex:none}
html[lang=en] .eyebrow{letter-spacing:.06em}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff9a2e,#ff6a00);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-decoration:none;box-shadow:0 6px 18px rgba(255,106,0,.28);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#2fe07f,#0fa34c);box-shadow:0 6px 18px rgba(18,161,80,.28)}
.btn.cy{background:linear-gradient(135deg,#26c6f0,#0a84d6);box-shadow:0 6px 18px rgba(10,132,214,.28)}
.btn.pk{background:linear-gradient(135deg,#ff4fa3,#e0106e);box-shadow:0 6px 18px rgba(240,22,125,.28)}
.btn.sm{padding:7px 13px;font-size:14.5px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.txt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;outline:0;min-width:0;width:100%}
.txt:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
select.txt option{background:var(--bg2);color:var(--ink)}
.txt::placeholder{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--k,#888) 14%,transparent);border:1px solid color-mix(in srgb,var(--k,#888) 45%,transparent);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--k)}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,#ff9a2e,#f0167d);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(240,22,125,.25)}
.hint{font-size:14px;color:var(--mut)}
/* ---------- lock ---------- */
#lock{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:30px max(16px,env(safe-area-inset-left,0px))}
.lockcard{width:min(100%,540px);padding:34px clamp(20px,5vw,42px);display:flex;flex-direction:column;gap:16px}
.lockcard h1{font-size:clamp(34px,7.5vw,48px);line-height:1.06;color:var(--ink)}
.lockcard h1 span,.hl span{background:linear-gradient(92deg,#ff7a00,#ff3d7f 60%,#c13dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.glyph{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#ff9a2e,#f0167d 55%,#8b3dff);box-shadow:0 10px 26px rgba(240,22,125,.3);font:800 30px var(--disp);color:#fff}
.chk{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:15px}
.err{color:#e0283c;font-weight:700;min-height:1.4em}
.prog{height:6px;border-radius:9px;background:var(--glass2);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9a2e,#f0167d,#8b3dff);transition:width .3s}
/* ---------- header + tabs ---------- */
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hin{max-width:1360px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center}
.brand{display:flex;gap:12px;align-items:center;min-width:0;flex:1}
.brand .glyph{width:42px;height:42px;border-radius:14px;font-size:21px;flex:none}
.brand b{display:block;font:800 19px/1.1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
.hb.lang{width:auto;padding:0 12px;font-weight:800;font-size:14px}
nav.tabs{max-width:1360px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-weight:700;font-size:15px;white-space:nowrap;display:flex;gap:7px;align-items:center;color:var(--ink)}
.tab.on{background:linear-gradient(135deg,#ff8a1f,#f0167d);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(240,22,125,.28)}
/* ---------- hero (other views) ---------- */
.hero{padding:24px clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(28px,4.4vw,44px);color:var(--ink)}
.hero h1 .ac{background:linear-gradient(92deg,#ff7a00,#ff3d7f 60%,#c13dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{color:var(--mut);font-size:17px}
.qs{display:flex;gap:10px;max-width:640px}
/* ---------- home: intro + big number ---------- */
.top2{display:grid;grid-template-columns:1fr minmax(260px,330px);gap:20px;align-items:stretch}
.intro{display:flex;flex-direction:column;gap:12px;padding:6px 2px}
.hl{font-size:clamp(34px,5.6vw,60px);line-height:1.04;letter-spacing:-.01em;color:var(--ink)}
.lead{margin:0;color:var(--mut);font-size:17.5px;max-width:760px}
.bigbox{position:relative;text-align:left;border-radius:22px;padding:22px 24px;border:1.5px solid color-mix(in srgb,var(--saf) 55%,transparent);background:linear-gradient(145deg,color-mix(in srgb,var(--saf) 14%,var(--card)),color-mix(in srgb,var(--pink) 8%,var(--card)));box-shadow:0 14px 36px color-mix(in srgb,var(--saf) 22%,transparent);display:flex;flex-direction:column;justify-content:center;gap:4px;color:var(--ink)}
.bigbox b{font:800 clamp(46px,6vw,64px)/1 var(--disp);background:linear-gradient(92deg,#ff7a00,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigbox span{font-weight:800;font-size:18px}
.bigbox small{color:var(--mut);font-size:14px}
/* ---------- stat strip / KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--k) 26%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--k) 11%,var(--card)),var(--card) 70%);border-radius:16px;padding:16px 16px 13px;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .18s,box-shadow .18s;color:var(--ink);box-shadow:0 6px 18px rgba(60,40,140,.06)}
.kpi::before{content:"";position:absolute;left:16px;top:0;width:52%;height:4px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--k),color-mix(in srgb,var(--k) 45%,#fff))}
.kpi:hover{transform:translateY(-2px);box-shadow:0 12px 26px color-mix(in srgb,var(--k) 25%,transparent)}
.kpi .ic{font-size:20px;line-height:1}
.kpi .v{font:800 clamp(28px,3vw,36px)/1.05 var(--disp);color:color-mix(in srgb,var(--k) 62%,var(--ink));order:-1;margin-top:4px}
.kpi .l{font-weight:700;color:var(--ink);font-size:14.5px;line-height:1.25}
.kpi .s{font-size:12.5px;color:var(--mut);line-height:1.3}
.kpi .ic{position:absolute;right:12px;top:12px;opacity:.9}
.strip .kpi .v{font-size:clamp(26px,2.6vw,32px)}
.insights{display:flex;gap:10px;flex-wrap:wrap}
.ins{border-radius:14px;padding:9px 14px;background:var(--card);border:1px solid var(--line);font-size:14.5px;display:flex;gap:8px;align-items:center}
.ins b{color:var(--saf)}
/* ---------- section headings ---------- */
.sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font:800 clamp(21px,2.6vw,26px)/1.2 var(--disp);margin:6px 0 -4px}
.sh::before{content:"";width:26px;height:5px;border-radius:4px;background:linear-gradient(90deg,#ff7a00,#f0167d);align-self:center;flex:none}
.sh small{font:500 14.5px var(--body);color:var(--mut)}
.card h3{display:flex;align-items:center;gap:10px;font-size:21px}
.card h3::before{content:"";width:20px;height:4px;border-radius:3px;background:linear-gradient(90deg,var(--saf),var(--pink));flex:none}
.card h3 small{font:500 14px var(--body);color:var(--mut)}
/* ---------- cards / layout ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:18px}
.card{padding:20px clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:14px;min-width:0}
.card .ch-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.chart{width:100%;min-height:120px;position:relative}
svg.ch{display:block;overflow:visible}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .ax{fill:var(--mut);font:12px var(--body)}
svg.ch .vl{fill:var(--ink);font:700 12.5px var(--body)}
svg.ch .bm{filter:drop-shadow(0 0 calc(6px*var(--glow)) var(--gc));transition:opacity .15s}
svg.ch g.bar{cursor:pointer}
svg.ch g.bar:hover .bm{opacity:.8}
svg.ch .seg{cursor:pointer;transition:transform .15s;transform-origin:center}
svg.ch .seg:hover{transform:scale(1.03)}
/* horizontal bars (HTML) */
.hb-list{display:flex;flex-direction:column;gap:4px}
.hbr{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;border:0;background:transparent;padding:6px 6px;border-radius:12px;text-align:left;color:var(--ink);width:100%}
.hbr:hover{background:var(--glass2)}
.hbr .lb{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .tr{height:12px;border-radius:99px;background:var(--glass2);overflow:hidden}
.hbr .tr b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--k),color-mix(in srgb,var(--k) 55%,#fff));box-shadow:0 0 calc(10px*var(--glow)) color-mix(in srgb,var(--k) 60%,transparent)}
.hbr .vv{font-weight:800;font-size:14.5px;min-width:56px;text-align:right}
.hbr .vv small{display:block;font-weight:500;color:var(--mut);font-size:12px}
/* donut */
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut .svgw{flex:none}
.legend{display:flex;flex-direction:column;gap:2px;flex:1;min-width:200px}
.lg{display:grid;grid-template-columns:14px 1fr auto auto;gap:9px;align-items:center;border:0;background:transparent;padding:5px 6px;border-radius:10px;text-align:left;color:var(--ink);font-size:14.5px}
.lg:hover{background:var(--glass2)}
.lg i{width:12px;height:12px;border-radius:4px;background:var(--k)}
.lg b{font-weight:800}.lg span.p{color:var(--mut);font-size:13px;min-width:42px;text-align:right}
/* flow strip */
.flow{display:flex;align-items:stretch;gap:0;padding:14px 10px;overflow-x:auto}
.fl{flex:1 1 0;min-width:150px;padding:4px 14px;display:flex;flex-direction:column;gap:2px}
.fl b{font:800 26px/1.1 var(--disp)}
.fl span{font-size:13px;color:var(--mut);line-height:1.3}
.fl.neg b{color:var(--coral)}
.fl.fin b{background:linear-gradient(92deg,#ff7a00,#f0167d);-webkit-background-clip:text;background-clip:text;color:transparent}
.fa{display:grid;place-items:center;color:var(--dim);font-size:22px;flex:none;padding:0 2px}
/* service category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.cat{display:flex;flex-direction:column;gap:8px;padding:16px 16px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.cat .ct{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border:0;background:transparent;padding:0;text-align:left;color:var(--ink)}
.cat .ct span{font:800 18px/1.2 var(--disp);color:color-mix(in srgb,var(--k) 70%,var(--ink))}
.cat .ct b{font:800 26px/1 var(--disp)}
.cat .bar{height:6px;border-radius:9px;background:var(--glass2);overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--k),color-mix(in srgb,var(--k) 50%,#fff))}
.cat .pc{font-size:13px;color:var(--mut);margin-top:-2px}
.cat ul{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column}
.cat li button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:transparent;padding:4px 4px;border-radius:8px;color:var(--ink);font-size:14.5px;text-align:left}
.cat li button:hover{background:var(--glass2)}
.cat li button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat li button b{font-weight:800;flex:none}
.cat li.mu button{color:var(--mut)}
/* feature tiles */
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.ft{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.ft .fi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:color-mix(in srgb,var(--k) 16%,var(--card));border:1px solid color-mix(in srgb,var(--k) 35%,transparent);flex:none}
.ft b{display:block;font-weight:800;font-size:15.5px}
.ft span{font-size:13.5px;color:var(--mut);line-height:1.35;display:block}
/* service cards (services tab) */
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sc{position:relative;text-align:left;border:1px solid color-mix(in srgb,var(--k) 25%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--k) 10%,var(--card)),var(--card) 75%);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink);overflow:hidden;transition:transform .18s,box-shadow .18s}
.sc::before{content:"";position:absolute;left:16px;top:0;width:52%;height:4px;border-radius:0 0 4px 4px;background:var(--k)}
.sc:hover,.sc.on{transform:translateY(-2px);border-color:var(--k);box-shadow:0 12px 26px color-mix(in srgb,var(--k) 25%,transparent)}
.sc .t{display:flex;gap:10px;align-items:center;font-weight:800;font-size:16px}
.sc .t .e{font-size:22px}
.sc .n{font:800 32px/1 var(--disp);color:color-mix(in srgb,var(--k) 62%,var(--ink))}
.sc .m{font-size:13px;color:var(--mut)}
/* detail panel */
#svd,#ad{scroll-margin-top:130px}
.detail{border-color:color-mix(in srgb,var(--k,#888) 45%,var(--line))!important;box-shadow:0 14px 36px color-mix(in srgb,var(--k,#888) 18%,transparent)!important}
.mk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mk div{border-radius:14px;background:var(--glass2);border:1px solid var(--line);padding:10px 14px}
.mk b{display:block;font:800 26px/1.1 var(--disp)}
.mk span{font-size:13px;color:var(--mut)}
/* area ranking */
.arow{display:grid;grid-template-columns:34px minmax(120px,1.2fr) 2fr 84px;gap:12px;align-items:center;padding:9px 8px;border-radius:14px;border:0;background:transparent;width:100%;text-align:left;color:var(--ink)}
.arow:hover{background:var(--glass2)}
.arow .rk{font:800 15px var(--disp);color:var(--dim);text-align:center}
.arow .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .nm small{display:block;font-weight:500;font-size:12.5px;color:var(--mut)}
.arow .tr{height:12px;border-radius:99px;background:var(--glass2);overflow:hidden}
.arow .tr b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#00a9d6,#8b3dff,#f0167d)}
.arow .vv{font-weight:800;text-align:right}
.alist{display:flex;flex-direction:column;max-height:720px;overflow:auto;padding-right:4px}
/* heat calendar */
.calw{overflow-x:auto;padding-bottom:6px}
.legend-seq{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mut)}
.legend-seq i{width:14px;height:14px;border-radius:4px;display:inline-block}
/* heat table */
.ht{border-collapse:separate;border-spacing:3px;width:100%;font-size:13.5px}
.ht th{font-weight:700;color:var(--mut);text-align:left;padding:4px 6px;white-space:nowrap}
.ht td{text-align:center;border-radius:8px;padding:7px 4px;font-weight:700;cursor:pointer;min-width:52px}
.ht td:hover{outline:2px solid var(--blue)}
.plist{display:flex;flex-direction:column}
/* ---------- list rows (shared) ---------- */
.lr{height:var(--rh);display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);cursor:pointer}
.lr:hover{background:var(--glass2)}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font:800 18px var(--disp);color:#fff;background:linear-gradient(135deg,var(--k),color-mix(in srgb,var(--k) 55%,#000))}
.lr .c{min-width:0}
.lr .n1{display:flex;gap:8px;align-items:center;min-width:0}
.lr .n1 b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .n2{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .n2 .tn{color:var(--ink);font-weight:600}
.cnt{font-size:12px;font-weight:800;border-radius:99px;padding:1px 8px;background:color-mix(in srgb,var(--yel) 18%,transparent);color:color-mix(in srgb,var(--yel) 55%,var(--ink));border:1px solid color-mix(in srgb,var(--yel) 55%,transparent);white-space:nowrap}
.done{font-size:12px;font-weight:800;border-radius:99px;padding:1px 8px;background:color-mix(in srgb,var(--lime) 15%,transparent);color:color-mix(in srgb,var(--lime) 60%,var(--ink));border:1px solid color-mix(in srgb,var(--lime) 50%,transparent);white-space:nowrap}
.acts{display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-size:18px;border:1px solid var(--line);background:var(--glass2)}
.ib.call{background:linear-gradient(135deg,#26c6f0,#0a84d6);border:0;box-shadow:0 4px 12px rgba(10,132,214,.3)}
.ib.wa{background:linear-gradient(135deg,#2fe07f,#0fa34c);border:0;box-shadow:0 4px 12px rgba(18,161,80,.3)}
.ib.off{opacity:.3;pointer-events:none;filter:grayscale(1)}
.ib svg{width:20px;height:20px;fill:#fff}
/* ---------- sheet (full list) ---------- */
#sheet{position:fixed;inset:0;z-index:70;background:var(--sheetbg);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sh-h{max-width:1100px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.sh-h h2{font-size:clamp(20px,3.4vw,28px)}
#lbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.vwrap{max-width:1100px;margin:0 auto;position:relative}
#vrows{position:absolute;left:0;right:0;top:0}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
/* ---------- drawer ---------- */
#ov{position:fixed;inset:0;background:rgba(20,26,61,.35);z-index:79}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:80;background:var(--bg2);border-left:1px solid var(--line);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 40px;display:flex;flex-direction:column;gap:16px;box-shadow:-20px 0 60px rgba(20,26,61,.18)}
.dh{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.dh h3{font-size:28px}
.x{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mut);font-weight:600}
.kv dd{margin:0;font-weight:600}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:8px}
.tl div{position:relative;padding:8px 0 8px 18px}
.tl div::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--k)}
.tl .d{font-weight:800}
.msg{white-space:pre-wrap;background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(20,26,61,.4)}
.mcard{width:min(100%,560px);max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--bg2)}
.qname{font:800 30px/1.1 var(--disp)}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px;color:var(--mut)}
textarea.txt{min-height:120px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
/* ---------- misc ---------- */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;box-shadow:0 10px 30px rgba(20,26,61,.2);max-width:260px}
#tip b{font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:110;background:var(--bg2);border:1px solid var(--saf);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 10px 26px rgba(255,122,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
footer.ft3{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px;font-size:13.5px;color:var(--mut)}
footer.ft3 .c{justify-self:center;border:1.5px solid var(--saf);color:var(--saf);border-radius:999px;padding:4px 14px;font-weight:800;white-space:nowrap}
footer.ft3 .r{justify-self:end;text-align:right}
footer.ft3 .r b{color:var(--ink)}
.sec-t{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.sec-t h2{font-size:clamp(24px,3.4vw,34px)}
@media(max-width:860px){.top2{grid-template-columns:1fr}}

 .arow{grid-template-columns:26px 1fr 64px;gap:8px}

 .kpis,.strip{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .kpi{padding:14px 12px 11px}

 footer.ft3{grid-template-columns:1fr;text-align:center}footer.ft3 .r{justify-self:center;text-align:center}
}
@media print{.bgfx,header.top,.btn,.chip{display:none!important}}

/* ======================= decrypt ======================= */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normPw=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function kek(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
let PAKO=null;function loadPako(){if(PAKO)return PAKO;PAKO=new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';s.onload=()=>ok(window.pako);s.onerror=()=>bad(new Error('pako'));document.head.append(s)});return PAKO}
async function gunzipText(buf){if(typeof DecompressionStream!=='undefined'){try{return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}catch(e){}}
 const pk=await loadPako();return new TextDecoder().decode(pk.ungzip(new Uint8Array(buf)))}
function setProg(p,msg){$('prog').hidden=false;$('prog').firstElementChild.style.width=(p*100).toFixed(0)+'%';$('lockmsg').textContent=msg||''}
async function unlock(raw){
 const pw=normPw(raw);$('lockerr').textContent='';
 if(!window.crypto||!crypto.subtle){$('lockerr').textContent=t('noCrypto');return}
 if(!pw){$('lockerr').textContent=t('needPw');return}
 $('openbtn').disabled=true;setProg(.1,t('checking'));
 try{const meta=JSON.parse($('payload').textContent);
  const key=await kek(pw,meta.salt,meta.iter);setProg(.45,t('opening'));
  let plain;try{plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(meta.iv)},key,b64(meta.ct))}catch(e){throw new Error('pw')}
  setProg(.75,t('opening'));const data=JSON.parse(await gunzipText(plain));
  if($('remember').checked)LS.set('dpk_pw',pw);else LS.del('dpk_pw');
  setProg(1,t('ready'));prep(data);boot();
 }catch(e){$('lockerr').textContent=e&&e.message==='pw'?t('badPw'):(t('badPw'));$('prog').hidden=true;$('lockmsg').textContent='';LS.del('dpk_pw')}
 finally{$('openbtn').disabled=false}}

const dDate=d=>new Date(EPOCH+d*DAY);
const dISO=d=>dDate(d).toISOString().slice(0,10);
const isoD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Math.round((Date.UTC(+m[1],m[2]-1,+m[3])-EPOCH)/DAY):null};
const fD=d=>{const x=dDate(d);return x.getUTCDate()+' '+MON[LANG][x.getUTCMonth()]+' '+x.getUTCFullYear()};
const fDs=d=>{const x=dDate(d);return String(x.getUTCDate()).padStart(2,'0')+'-'+String(x.getUTCMonth()+1).padStart(2,'0')+'-'+x.getUTCFullYear()};
const mKey=d=>{const x=dDate(d);return x.getUTCFullYear()*12+x.getUTCMonth()};

function ageNow(v){if(!v)return null;const y=Math.floor(v/1e4),m=Math.floor(v/100)%100,d=v%100;let a=NOW.getFullYear()-y;if(NOW.getMonth()+1<m||(NOW.getMonth()+1===m&&NOW.getDate()<d))a--;return a}
const band=a=>a==null?-1:AGEB.findIndex(([lo,hi])=>a>=lo&&a<=hi);

 D=new Int16Array(N);H=new Int8Array(N);PU=new Int8Array(N);SB=new Int8Array(N);AR=new Int16Array(N);OK=new Uint8Array(N);VOL=new Uint8Array(N);PID=new Int32Array(N);DOB=new Int32Array(N);AD=new Int32Array(N);DS=new Int32Array(N);NM=new Array(N);MB=new Array(N);
 MAXD=-1;MIND=1e9;let np=0;
 for(let i=0;i<N;i++){const r=R[i];D[i]=r[0];H[i]=r[1];NM[i]=r[2];MB[i]=r[3];OK[i]=r[4];AR[i]=r[5];AD[i]=r[6];PU[i]=r[7];SB[i]=r[8];DS[i]=r[9];DOB[i]=r[10];VOL[i]=r[11];PID[i]=r[12];
  if(r[0]>MAXD)MAXD=r[0];if(r[0]<MIND)MIND=r[0];if(r[12]+1>np)np=r[12]+1}
 PEOPLE=new Array(np);
 for(let i=0;i<N;i++){let q=PEOPLE[PID[i]];if(!q)q=PEOPLE[PID[i]]={id:PID[i],v:[]};q.v.push(i)}
 for(const q of PEOPLE){q.v.sort((a,b)=>D[a]-D[b]||a-b);const s=new Set();let dob=0,vol=0;for(const i of q.v){s.add(D[i]);if(DOB[i])dob=DOB[i];if(VOL[i])vol=1}
  q.nd=s.size;q.first=D[q.v[0]];q.last=D[q.v[q.v.length-1]];q.i=q.v[q.v.length-1];q.dob=dob;q.vol=vol;q.age=ageNow(dob);q.band=band(q.age)}
 DAYS=new Map();for(let i=0;i<N;i++)DAYS.set(D[i],(DAYS.get(D[i])||0)+1);
 NAREA=p.area_en.length;buildHay()}

 const W=Math.max(260,el.clientWidth||600),Hh=o.h||230,pl=o.pl??38,pr=6,pt=22,pb=o.pb??30;const n=items.length||1;

 let s=`<svg class="ch" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" role="img">${gradDefs(items.map(d=>d.c))}`;

 barsV($('gA'),ab.map((v,k)=>({l:AGEL[LANG][k],v,c:v===amx?nk('p'):nk('g'),lab:true,tip:`<b>${fmt(v)}</b> ${t('people')}<br>${AGEL[LANG][k]}`})),{h:240,maxw:60,lw:44,onClick:(d,k)=>openList(t('ch_age')+' · '+AGEL[LANG][k],PEOPLE.filter(p=>p.band===k).map(p=>p.i),'person')});
 m.querySelectorAll('.ht td').forEach(td=>td.onclick=()=>{const d=pu[+td.dataset.r],k=+td.dataset.k;openList(d.l+' · '+AGEL[LANG][k],pFilter(i=>PU[i]===d.p&&person(i).band===k),'visit')})}

/* ---------- VOLUNTEERS ---------- */
function vVol(m){const vs=PEOPLE.filter(p=>p.vol).sort((a,b)=>b.last-a.last);const idx=vs.map(p=>p.i);
 m.innerHTML=`<section class="glass hero"><div class="eyebrow">🙋 ${esc(t('t_vol'))}</div><h1 style="font-size:clamp(28px,4.4vw,44px)">${esc(t('vo_title'))}</h1><div class="hint">${esc(t('vo_h'))}</div>
 <div class="kpis">${kpi('vk1','🙋',t('k_vol'),vs.length,'',nk('b'))}</div><div class="row"><button class="btn pk" type="button" id="vq">▶ ${esc(t('queue'))}</button><button class="btn" type="button" id="vl">📋 ${esc(t('openList'))}</button><button class="btn wa" type="button" id="vwa">📲 ${esc(t('shareWa'))}</button></div></section>
 <div class="grid2">${card(`<h3>${esc(t('vo_area'))}</h3><div id="vA"></div>`)}${card(`<h3>${esc(t('l_vol'))}</h3><div class="plist" id="vP"></div>`)}</div>`;
 animKPIs(m);
 const op=()=>openList(t('l_vol'),idx,'person',{kind:'vol'});$('vk1').onclick=op;$('vl').onclick=op;$('vq').onclick=()=>startQueue(idx,'vol');$('vwa').onclick=()=>waShare(reportText(t('l_vol'),idx));
 barsH($('vA'),areaItems(idx,12).map(d=>({...d,c:nk('b')})),{total:idx.length,onClick:d=>openList(t('l_vol')+' · '+d.l,idx.filter(i=>AR[i]===d.a),'person',{kind:'vol'})});
 const el=$('vP');el.innerHTML=idx.map(i=>rowHTML(i,'person','vol')).join('');bindRows(el,'vol')}

/* ---------- RECORDS / SEARCH ---------- */
let RF=LS.get('dpk_rf',{});
function recFilter(f){const a=isoD(f.from),b=isoD(f.to),q=(f.q||'').trim().toLowerCase(),qs=q?q.split(/\s+/):[];const pu=f.pu===''||f.pu==null?null:+f.pu,sb=f.sb===''||f.sb==null?null:+f.sb,ar=f.ar===''||f.ar==null?null:+f.ar,ag=f.ag===''||f.ag==null?null:+f.ag;
 return pFilter(i=>(a==null||D[i]>=a)&&(b==null||D[i]<=b)&&(pu==null||PU[i]===pu)&&(sb==null||SB[i]===sb)&&(ar==null||AR[i]===ar)&&(ag==null||person(i).band===ag)&&(!f.rep||person(i).nd>=2)&&(!f.vol||person(i).vol)&&(!f.mob||OK[i])&&(!qs.length||qs.every(w=>HAY[i].includes(w))))}
function vRec(m){const ars=areaItems(allIdx()).sort((x,y)=>x.l.localeCompare(y.l));const opt=(v,l,sel)=>`<option value="${v}"${String(sel??'')===String(v)?' selected':''}>${esc(l)}</option>`;
 m.innerHTML=`<section class="glass hero"><div class="eyebrow">🔍 ${esc(t('t_rec'))}</div><h1 style="font-size:clamp(28px,4.4vw,44px)">${esc(t('rc_title'))}</h1><div class="hint">${esc(t('rc_h'))}</div>
 <div class="fgrid">
  <label class="f">${esc(t('f_q'))}<input class="txt" id="f_q" type="search" value="${esc(RF.q||'')}"></label>
  <label class="f">${esc(t('f_from'))}<input class="txt" id="f_from" type="date" value="${esc(RF.from||'')}" min="${dISO(MIND)}" max="${dISO(MAXD)}"></label>
  <label class="f">${esc(t('f_to'))}<input class="txt" id="f_to" type="date" value="${esc(RF.to||'')}" min="${dISO(MIND)}" max="${dISO(MAXD)}"></label>
  <label class="f">${esc(t('f_pur'))}<select class="txt" id="f_pu">${opt('',t('all'),RF.pu)}${P.purpose.map((x,p)=>opt(p,pName(p),RF.pu)).join('')}</select></label>
  <label class="f">${esc(t('f_sub'))}<select class="txt" id="f_sb">${opt('',t('all'),RF.sb)}${P.sub.map((x,s)=>opt(s,sName(s),RF.sb)).join('')}</select></label>
  <label class="f">${esc(t('f_area'))}<select class="txt" id="f_ar">${opt('',t('all'),RF.ar)}${ars.map(d=>opt(d.a,d.l,RF.ar)).join('')}</select></label>
  <label class="f">${esc(t('f_age'))}<select class="txt" id="f_ag">${opt('',t('all'),RF.ag)}${AGEL[LANG].map((l,k)=>opt(k,l,RF.ag)).join('')}</select></label>
  <label class="f">${esc(t('f_mode'))}<select class="txt" id="f_mode">${opt('visit',t('m_visit'),RF.mode||'visit')}${opt('person',t('m_person'),RF.mode||'visit')}</select></label>
 </div>
 <div class="row"><label class="chk"><input type="checkbox" id="f_rep"${RF.rep?' checked':''}> ${esc(t('f_rep'))}</label><label class="chk"><input type="checkbox" id="f_vol"${RF.vol?' checked':''}> ${esc(t('f_vol'))}</label><label class="chk"><input type="checkbox" id="f_mob"${RF.mob?' checked':''}> ${esc(t('f_mob'))}</label><span class="sp"></span><button class="btn ghost sm" type="button" id="f_reset">✕ ${esc(t('reset'))}</button></div>
 <div class="kpis" id="rk"></div>
 <div class="row"><button class="btn" type="button" id="rlist">📋 ${esc(t('openList'))}</button><button class="btn wa" type="button" id="rwa">📲 ${esc(t('shareWa'))}</button><button class="btn pk" type="button" id="rq">▶ ${esc(t('queue'))}</button></div></section>
 <div class="grid2">${card(`<h3>${esc(t('ch_pur'))}</h3><div id="rP"></div>`)}${card(`<h3>${esc(t('ch_area'))}</h3><div id="rA"></div>`)}</div>`;
 let cur=[];const ids=['q','from','to','pu','sb','ar','ag','mode'];
 const run=()=>{RF={};ids.forEach(k=>RF[k]=$('f_'+k).value);['rep','vol','mob'].forEach(k=>RF[k]=$('f_'+k).checked);LS.set('dpk_rf',RF);cur=recFilter(RF);
  $('rk').innerHTML=kpi('rk1','📋',t('k_visits'),cur.length,esc(t('found')),nk('o'))+kpi('rk2','👥',t('people'),uniqP(cur),'',nk('c'));$('rk').querySelectorAll('.v').forEach(e=>e.textContent=fmt(+e.dataset.v));
  $('rk1').onclick=$('rlist').onclick;$('rk2').onclick=()=>openList(t('rc_title'),cur,'person');
  barsH($('rP'),purposeItems(cur,false),{total:cur.length,onClick:d=>{$('f_pu').value=d.p;run()}});barsH($('rA'),areaItems(cur,12),{total:cur.length,onClick:d=>{$('f_ar').value=d.a;run()}})};
 let tmr;ids.concat(['rep','vol','mob']).forEach(k=>{const e=$('f_'+k);e.addEventListener(k==='q'?'input':'change',()=>{clearTimeout(tmr);tmr=setTimeout(run,180)})});
 $('f_reset').onclick=()=>{RF={};LS.set('dpk_rf',RF);render()};
 $('rlist').onclick=()=>openList(t('rc_title'),cur,RF.mode==='person'?'person':'visit');$('rwa').onclick=()=>waShare(reportText(t('rc_title'),cur));$('rq').onclick=()=>startQueue(cur.slice().sort((x,y)=>D[y]-D[x]),'follow');
 run()}

/* ======================= settings ======================= */
function openSettings(){const m=$('modal'),c=$('mcard');m.hidden=false;const L=ME.mlang||'mr';
 c.innerHTML=`<div class="row" style="justify-content:space-between"><h3>⚙️ ${esc(t('st_title'))}</h3><button class="x" type="button" id="sx">✕</button></div>
 <label class="f">${esc(t('st_mlang'))}<select class="txt" id="s_ml"><option value="mr"${L==='mr'?' selected':''}>मराठी</option><option value="en"${L==='en'?' selected':''}>English</option></select></label>
 <label class="f">${esc(t('st_sender'))}<input class="txt" id="s_sn" value="${esc(sender())}"></label>
 <div><b>${esc(t('st_tpl'))}</b><div class="hint">${esc(t('st_tpl_h'))}</div></div>
 ${['follow','bday','vol'].map(k=>`<label class="f">${esc(t('tp_'+k))}<textarea class="txt" id="s_t_${k}">${esc(tpl(k))}</textarea></label>`).join('')}
 <div class="row"><button class="btn" type="button" id="ssave">${esc(t('st_save'))}</button><button class="btn ghost" type="button" id="sreset">${esc(t('st_reset'))}</button></div>
 <hr style="border:0;border-top:1px solid var(--line);width:100%">
 <button class="btn cy" type="button" id="soff">${esc(t('st_offline'))}</button><div class="hint">${esc(t('st_offline_h'))}</div>
 <button class="btn ghost sm" type="button" id="sclr">${esc(t('st_clear'))}</button>
 <button class="btn pk sm" type="button" data-act="lock">🔒 ${esc(t('st_lock'))}</button>`;
 $('sx').onclick=()=>m.hidden=true;
 $('s_ml').onchange=e=>{ME.mlang=e.target.value;LS.set('dpk_me',ME);openSettings()};
 $('ssave').onclick=()=>{const L=ME.mlang||'mr';ME['s_'+L]=$('s_sn').value.trim();['follow','bday','vol'].forEach(k=>ME['t_'+L+'_'+k]=$('s_t_'+k).value);LS.set('dpk_me',ME);toast(t('saved'));m.hidden=true;if(!$('sheet').hidden)drawRows()};
 $('sreset').onclick=()=>{const L=ME.mlang||'mr';delete ME['s_'+L];['follow','bday','vol'].forEach(k=>delete ME['t_'+L+'_'+k]);LS.set('dpk_me',ME);openSettings()};
 $('soff').onclick=()=>{nativeSave('karyalay-bhet-dashboard.html',new Blob([ORIG],{type:'text/html;charset=utf-8'}));toast('✓')};
 $('sclr').onclick=()=>{for(const k of Object.keys(DONE))delete DONE[k];LS.set('dpk_done',DONE);toast('✓');render()}}

/* ======================= boot + global events ======================= */
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-th]').forEach(e=>e.innerHTML=t(e.dataset.th));document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
 document.querySelectorAll('[data-act="lang"]').forEach(b=>b.textContent=LANG==='mr'?'EN':'मराठी');$('themebtn').textContent=THEME==='dark'?'☀️':'🌙';document.title=t('hdrTitle')+' · '+t('hdrSub')}
function boot(){$('lock').hidden=true;$('app').hidden=false;applyLang();buildTabs();render();
 if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='lang'){LANG=LANG==='mr'?'en':'mr';LS.set('dpk_lang',LANG);applyLang();if(P){buildTabs();render();if(!$('sheet').hidden){$('lcount').textContent='';applyList()}}}
 else if(a==='theme'){THEME=THEME==='dark'?'light':'dark';LS.set('dpk_theme2',THEME);document.documentElement.dataset.theme=THEME;applyLang();if(P)render()}
 else if(a==='settings')openSettings();
 else if(a==='lock'){LS.del('dpk_pw');location.hash='';location.reload()}});
$('lockform').addEventListener('submit',e=>{e.preventDefault();unlock($('pw').value)});
$('lback').onclick=()=>{if(history.state&&history.state.sheet)history.back();else closeList()};
window.addEventListener('popstate',()=>{if(!$('drawer').hidden){closePerson();return}if(!$('sheet').hidden)closeList()});
$('lq').addEventListener('input',()=>{clearTimeout(window.__lq);window.__lq=setTimeout(()=>{LIST.q=$('lq').value;$('lbody').scrollTop=0;applyList()},150)});
$('lsort').onchange=e=>{LIST.sort=e.target.value;applyList()};
$('lbody').addEventListener('scroll',()=>requestAnimationFrame(drawRows),{passive:true});
$('vrows').addEventListener('click',e=>{const r=e.target.closest('.lr');if(!r)return;if(e.target.closest('[data-stop]')){const dn=e.target.closest('[data-done]');if(dn&&!DONE[dn.dataset.done]){setDone(+dn.dataset.done);setTimeout(drawRows,300)}return}openPerson(+r.dataset.i,LIST.kind)});
$('lwa').onclick=()=>waShare(listSummary());$('lxlsx').onclick=exportXLSX;$('lfile').onclick=shareFile;$('lprint').onclick=printList;$('lqueue').onclick=()=>startQueue(LIST.cur,LIST.kind);
$('ov').onclick=closePerson;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden)$('modal').hidden=true;else if(!$('drawer').hidden)closePerson();else if(!$('sheet').hidden)closeList()}});
let RZ;addEventListener('resize',()=>{clearTimeout(RZ);RZ=setTimeout(()=>{rerenderCharts();if(!$('sheet').hidden)applyList()},200)});
applyLang();
(()=>{const s=LS.get('dpk_pw',null);if(s){$('pw').value=s;unlock(s)}})();
</script>
